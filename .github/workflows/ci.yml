name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Install (core + dev only — fast path, no torch/GDAL)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/satpi --no-error-summary || true   # advisory in pilot
      - name: Tests
        run: pytest -m "not ml and not network" --cov=satpi --cov-report=term
      - name: Config validation (portability gate)
        run: |
          satpi validate-config --path configs/study_areas/sw_pennsylvania.yaml
          satpi validate-config --path configs/study_areas/_template.yaml
      - name: Demo cycle (end-to-end smoke)
        run: satpi run-cycle --horizon-hours 0.1

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t satpi-api .
      - name: Build worker image
        run: docker build -f docker/Dockerfile.worker -t satpi-worker .
