[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "satpi"
version = "0.1.0"
description = "SatPI-FM-CDT: satellite-informed, physics-consistent, causal flood intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SatPI Team" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.3",
    "networkx>=3.3",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
]

[project.urls]
Homepage = "https://github.com/Wallostonite/satpi"
Repository = "https://github.com/Wallostonite/satpi"
Issues = "https://github.com/Wallostonite/satpi/issues"
"Data sources" = "https://github.com/Wallostonite/satpi/blob/main/DATA_SOURCES.md"

[project.optional-dependencies]
# Heavy geospatial + ML stacks are opt-in so the core platform stays lightweight
# and CI stays fast. Install with: pip install -e ".[ml,geo]"
ml = [
    "torch>=2.3",
    "lightning>=2.3",
    "torchgeo>=0.6",
    "onnx>=1.16",
    "mlflow>=2.14",
]
geo = [
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2024.5",
    "zarr>=2.18",
    "geopandas>=1.0",
    "pystac-client>=0.8",
    "shapely>=2.0",
    "pyproj>=3.6",
]
causal = [
    "dowhy>=0.11",
    "tigramite>=5.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
satpi = "satpi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/satpi"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "ml: requires torch (deselect with '-m \"not ml\"')",
    "network: requires internet access",
]
